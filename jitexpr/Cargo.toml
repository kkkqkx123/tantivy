[package]
name = "kkkqkx-jitexpr"
version = "0.1.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/kkkqkx123/tantivy"
repository = "https://github.com/kkkqkx123/tantivy"
description = "JIT-compiled expression evaluation for tantivy"

[lib]
# Keep the library name stable across the package rename so intra-crate
# doctests and dependents' imports are unaffected.
name = "jitexpr"

[dependencies]
cranelift = "0.134.3"
cranelift-jit = "0.134.3"
cranelift-module = "0.134.3"
cranelift-native = "0.134.3"
lru = "0.18.2"
regex = "1"
thiserror = "2.0.1"

[dev-dependencies]
proptest = "1.7.0"
