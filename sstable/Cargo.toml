[package]
name = "tantivy-sstable"
version = "0.27.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/kkkqkx123/tantivy"
repository = "https://github.com/kkkqkx123/tantivy"
keywords = ["search", "information", "retrieval", "sstable"]
categories = ["database-implementations", "data-structures", "compression"]
description = "sstables for tantivy"

[lib]
# Keep the library name stable across the package rename so intra-crate
# doctests and dependents' imports are unaffected.
name = "tantivy_sstable"

[dependencies]
common = {version= "0.27", path="../common", package="tantivy-common"}
futures-util = "0.3.30"
itertools = "0.14.0"
tantivy-bitpacker = { version= "0.27", path="../bitpacker", package = "tantivy-bitpacker" }
tantivy-fst = "0.5"
# experimental gives us access to Decompressor::upper_bound
zstd = { version = "0.14", optional = true, features = ["experimental"] }

[features]
zstd-compression = ["zstd"]

[dev-dependencies]
proptest = "1"
criterion = { version = "0.8", default-features = false }
names = "0.14"
rand = "0.9"

[[bench]]
name = "stream_bench"
harness = false

[[bench]]
name = "ord_to_term"
harness = false

