[package]
name = "tantivy-stacker"
version = "0.27.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/kkkqkx123/tantivy"
repository = "https://github.com/kkkqkx123/tantivy"
description = "term hashmap used for indexing"

[lib]
# Keep the library name stable across the package rename so intra-crate
# doctests and dependents' imports are unaffected.
name = "tantivy_stacker"

[dependencies]
murmurhash32 = "0.4"
common = { version = "0.27", path = "../common/", package = "tantivy-common" }
ahash = { version = "0.8.11", default-features = false, optional = true }


[[bench]]
harness = false
name = "bench"
path = "benches/bench.rs"

[[example]]
name = "hashmap"
path = "example/hashmap.rs"

[dev-dependencies]
rand = "0.9"
zipf = "7.0.0"
rustc-hash = "2.1.0"
proptest = "1.2.0"
binggan = { version = "0.17.0" }
rand_distr = "0.5"

[features]
compare_hash_only = ["ahash"] # Compare hash only, not the key in the Hashmap
unstable = [] # useful for benches.
