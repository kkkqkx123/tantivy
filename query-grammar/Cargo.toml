[package]
name = "kkkqkx-tantivy-query-grammar"
version = "0.27.0"
authors = ["Paul Masurel <paul.masurel@gmail.com>"]
license = "MIT"
categories = ["database-implementations", "data-structures"]
description = """Search engine library"""
homepage = "https://github.com/kkkqkx123/tantivy"
repository = "https://github.com/kkkqkx123/tantivy"
readme = "README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"

[lib]
# Keep the library name stable across the package rename so intra-crate
# doctests and dependents' imports are unaffected.
name = "tantivy_query_grammar"

[dependencies]
nom = "7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ordered-float = "5.0.0"
fnv = "1.0.7"
